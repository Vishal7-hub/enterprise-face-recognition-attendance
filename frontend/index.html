<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Face Recognition Attendance</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            text-align: center;
            padding: 30px;
        }

        .container {
            max-width: 800px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        h1 {
            margin-bottom: 25px;
        }

        video {
            width: 100%;
            max-width: 640px;
            border-radius: 10px;
            background: black;
            transform: scaleX(-1);
        }

        button {
            margin-top: 20px;
            padding: 12px 25px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
        }

        #startBtn {
            background: #198754;
            color: white;
        }

        #stopBtn {
            background: #dc3545;
            color: white;
            margin-left: 10px;
        }

        #status {
            margin-top: 20px;
            font-size: 18px;
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Face Recognition Attendance</h1>

    <video id="video" autoplay playsinline></video>

    <br>

    <button id="startBtn">Start Camera</button>
    <button id="stopBtn">Stop Camera</button>

    <div id="status">
        Camera is stopped
    </div>

</div>


<script>

const video = document.getElementById("video");
const statusText = document.getElementById("status");

let stream = null;
let recognitionInterval = null;
let isProcessing = false;


/* Canvas is used to capture frames from webcam */

const canvas = document.createElement("canvas");


/* Start Camera */

document.getElementById("startBtn").onclick = async () => {

    try {

        stream = await navigator.mediaDevices.getUserMedia({
            video: true,
            audio: false
        });

        video.srcObject = stream;

        statusText.innerText =
            "Camera started - Looking for employee...";


        /*
         * Send one frame every 2 seconds
         */

        recognitionInterval = setInterval(
            sendFrame,
            2000
        );

    } catch (error) {

        console.error(error);

        statusText.innerText =
            "Camera permission denied or unavailable.";

    }

};


/* Capture webcam frame and send it to backend */

async function sendFrame() {

    /*
     * Prevent multiple requests from running
     * at the same time.
     */

    if (isProcessing) {
        return;
    }

    if (!video.videoWidth || !video.videoHeight) {
        return;
    }

    isProcessing = true;


    /* Set canvas size equal to video */

    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;


    /* Draw current video frame */

    const context = canvas.getContext("2d");

    context.drawImage(
        video,
        0,
        0,
        canvas.width,
        canvas.height
    );


    /*
     * Convert frame into JPEG
     */

    canvas.toBlob(async (blob) => {

        if (!blob) {

            isProcessing = false;
            return;

        }


        const formData = new FormData();

        formData.append(
            "file",
            blob,
            "camera_frame.jpg"
        );


        try {

            /*
             * Send frame to FastAPI
             */

            const response = await fetch(
                "/recognition/camera",
                {
                    method: "POST",
                    body: formData
                }
            );


            const data = await response.json();


            console.log("Recognition response:", data);


            /*
             * Employee recognized
             */

            if (data.recognized) {

                statusText.innerText =
                    `Employee ID: ${data.employee_id}
                     | ${data.attendance}`;

            }

            /*
             * Face not recognized
             */

            else {

                statusText.innerText =
                    "Looking for employee...";

            }


        } catch (error) {

            console.error(
                "Recognition error:",
                error
            );

            statusText.innerText =
                "Unable to connect to recognition service.";

        }


        isProcessing = false;

    }, "image/jpeg");

}


/* Stop Camera */

document.getElementById("stopBtn").onclick = () => {

    /*
     * Stop recognition requests
     */

    if (recognitionInterval) {

        clearInterval(
            recognitionInterval
        );

        recognitionInterval = null;
    }


    /*
     * Stop webcam
     */

    if (stream) {

        stream.getTracks().forEach(
            track => track.stop()
        );

        stream = null;
    }


    video.srcObject = null;

    statusText.innerText =
        "Camera stopped";

};

</script>

</body>

</html>
